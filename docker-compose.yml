services:
  postgres:
    image: postgres:16-alpine
    container_name: datapilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-datapilot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapilot} -d ${POSTGRES_DB:-datapilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datapilot-net

  redis:
    image: redis:7-alpine
    container_name: datapilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datapilot-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  datapilot-net:
    driver: bridge
